# Apply Supabase migrations to prod (US) when SQL changes land on main.
name: DB Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Verify secrets
        run: |
          missing=0
          for k in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!k}" ]; then
              echo "::error::$k is not set. See .github/CI_CD.md"
              missing=1
            fi
          done
          exit $missing

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" -p "$SUPABASE_DB_PASSWORD"

      - name: Push migrations
        run: supabase db push --yes -p "$SUPABASE_DB_PASSWORD"

      - name: List remote migration status
        run: supabase migration list
