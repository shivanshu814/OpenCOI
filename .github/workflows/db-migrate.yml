# Apply Supabase migrations to prod (US) when SQL changes land on main.
name: DB Migrate

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/db-migrate.yml"
  workflow_dispatch:

concurrency:
  group: db-migrate-prod
  cancel-in-progress: false

jobs:
  migrate:
    name: supabase db push (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Supabase CLI
        run: npm install -g supabase@latest

      - name: Verify secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL is not set (direct Postgres URL). See .github/CI_CD.md"
            exit 1
          fi

      - name: Push migrations
        run: supabase db push --yes --db-url "$SUPABASE_DB_URL"
