# Production release: CI → DB migrate → Vercel prod deploy.
# Uses remote Vercel build (not --prebuilt) so dashboard env — including
# NEXT_PUBLIC_* — is applied correctly. Prebuilt+pull wiped Sensitive publics.
name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: https://getcertshield.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://zbpeqqqpaugtppphscem.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder
      NEXT_PUBLIC_PADDLE_ENV: sandbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-fund --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run seo:content
      - run: npm run build
      # Boots the app in demo mode and asserts every route renders with the
      # expected content. Blocks the deploy on request-time failures that
      # compile cleanly — the class of bug a build alone cannot see.
      - run: npm run smoke

  migrate:
    name: Supabase migrations
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g supabase@latest
      - name: Verify secrets
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL missing — see .github/CI_CD.md"
            exit 1
          fi
      - run: supabase db push --yes --db-url "$SUPABASE_DB_URL"

  deploy:
    name: Vercel production
    needs: [quality, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: Production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Vercel secrets
        run: |
          for k in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!k}" ]; then
              echo "::error::$k missing — see .github/CI_CD.md"
              exit 1
            fi
          done

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Remote build reads Production env from the Vercel project dashboard.
      # Avoid `vercel pull` + `--prebuilt` — Sensitive/empty pulls bake blank NEXT_PUBLIC_*.
      # If VERCEL_TOKEN is stale but Vercel Git already shipped this SHA, treat as success
      # (docs: prefer a long-lived token from vercel.com/account/tokens).
      - name: Deploy to production
        id: deploy
        run: |
          set +e
          out=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" 2>&1)
          status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            url=$(echo "$out" | tail -n 1 | tr -d '\r')
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "mode=cli" >> "$GITHUB_OUTPUT"
            echo "Deployed via CLI: $url"
            exit 0
          fi

          echo "CLI deploy failed (exit $status). Checking Vercel for this commit…"
          api=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&limit=15&target=production")
          match=$(echo "$api" | node -e '
            const fs = require("fs");
            const sha = process.env.GITHUB_SHA;
            let data;
            try { data = JSON.parse(fs.readFileSync(0, "utf8")); } catch { process.exit(2); }
            const hit = (data.deployments || []).find((d) =>
              (d.meta && d.meta.githubCommitSha) === sha &&
              (d.readyState === "READY" || d.state === "READY")
            );
            if (!hit) process.exit(1);
            process.stdout.write(hit.url || "");
          ')
          if [ -n "$match" ]; then
            url="https://$match"
            echo "url=$url" >> "$GITHUB_OUTPUT"
            echo "mode=git-fallback" >> "$GITHUB_OUTPUT"
            echo "Commit already live via Vercel Git: $url"
            exit 0
          fi

          echo "::error::Vercel CLI deploy failed and commit ${GITHUB_SHA} is not READY in production. Refresh VERCEL_TOKEN (vercel.com/account/tokens → GitHub secret)."
          exit 1

      - name: Summary
        run: |
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: ${{ steps.deploy.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Alias: https://getcertshield.vercel.app" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
