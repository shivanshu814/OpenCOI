# CI — quality gate (PRs + every push)
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Build-time placeholders only — real secrets live on Vercel / Supabase.
      NEXT_PUBLIC_APP_URL: https://getcertshield.vercel.app
      NEXT_PUBLIC_SUPABASE_URL: https://zbpeqqqpaugtppphscem.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder
      NEXT_PUBLIC_PADDLE_ENV: sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install --no-fund --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # Boots the app in demo mode and asserts every route renders with the
      # expected content — catches request-time failures that compile fine.
      - name: Smoke test
        run: npm run smoke
